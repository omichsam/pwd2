services:
  db:
    image: mysql:8.0
    restart: always
    env_file: ${ENV_FILE:-.env.production}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  release:
    build: .
    restart: "no"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear"]
    env_file: ${ENV_FILE:-.env.production}
    environment:
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
      DB_WAIT_TIMEOUT: "60"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: always
    command: gunicorn pwd_system.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -
    env_file: ${ENV_FILE:-.env.production}
    environment:
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
      DB_WAIT_TIMEOUT: "60"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      release:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_data:/staticfiles:ro
      - media_data:/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  mysql_data:
  media_data:
  static_data:
