{% extends "base/base.html" %}
{% block title %}Password Reset Complete — PWD Access{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-950 via-teal-800 to-teal-600 p-6">
  <div class="w-full max-w-md">

    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-3">
        <i class="fas fa-wheelchair text-white text-2xl"></i>
      </div>
      <h2 class="text-white font-bold text-xl">PWD Access Kenya</h2>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8 text-center">
      <div class="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-check-circle text-emerald-600 text-2xl"></i>
      </div>
      <h3 class="text-lg font-bold text-gray-800 mb-2">Password Reset Successful</h3>
      <p class="text-sm text-gray-500 leading-relaxed mb-6">
        Your password has been updated successfully. You can now log in with your new password.
      </p>
      <a href="{% url 'accounts:login' %}"
         class="inline-flex items-center gap-2 bg-teal-600 hover:bg-teal-700 text-white font-semibold px-6 py-2.5 rounded-xl transition-colors text-sm">
        <i class="fas fa-sign-in-alt text-xs"></i> Log In Now
      </a>
    </div>
  </div>
</div>
{% endblock %}
