{% if ask_result.ok %}
<div class="mt-3 rounded-xl bg-gray-50 border border-gray-200 p-4 text-sm text-gray-800">
  <p class="whitespace-pre-line">{{ ask_result.answer }}</p>
  {% if ask_result.citations %}<p class="text-xs text-gray-500 mt-2">{{ ask_result.citations }}</p>{% endif %}
</div>
{% else %}
<p role="alert" class="mt-3 text-sm text-red-700"><i class="fas fa-times-circle mr-1"></i> {{ ask_result.error|default:"DocAssist didn't return an answer. Try &quot;Test connection&quot; to see why." }}</p>
{% endif %}
