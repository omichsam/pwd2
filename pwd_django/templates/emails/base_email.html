<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block subject %}PWD Access Kenya{% endblock %}</title>
  <style>
    body { margin:0; padding:0; background:#f3f4f6; font-family:'Segoe UI',Arial,sans-serif; color:#374151; }
    .wrapper { max-width:600px; margin:32px auto; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,0.07); }
    .header { background:linear-gradient(135deg,#0f766e,#14b8a6); padding:32px 40px; text-align:center; }
    .header img { height:40px; }
    .header h1 { color:#fff; font-size:22px; margin:12px 0 4px; font-weight:700; }
    .header p { color:#99f6e4; font-size:13px; margin:0; }
    .body { padding:36px 40px; }
    .body p { font-size:15px; line-height:1.7; margin:0 0 16px; color:#4b5563; }
    .body .greeting { font-size:17px; font-weight:600; color:#111827; margin-bottom:8px; }
    .btn { display:inline-block; margin:20px 0; padding:13px 28px; background:#0d9488; color:#fff !important; text-decoration:none; border-radius:10px; font-weight:600; font-size:15px; }
    .info-box { background:#f0fdfa; border:1px solid #99f6e4; border-radius:10px; padding:16px 20px; margin:20px 0; }
    .info-box p { margin:0; font-size:14px; color:#0f766e; }
    .divider { height:1px; background:#f3f4f6; margin:24px 0; }
    .footer { background:#f9fafb; padding:20px 40px; text-align:center; border-top:1px solid #f3f4f6; }
    .footer p { font-size:12px; color:#9ca3af; margin:4px 0; }
    .footer a { color:#0d9488; text-decoration:none; }
    .badge { display:inline-block; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:600; }
    .badge-success { background:#d1fae5; color:#065f46; }
    .badge-info { background:#e0f2fe; color:#075985; }
    .badge-warning { background:#fef9c3; color:#854d0e; }
    .badge-error { background:#fee2e2; color:#991b1b; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>PWD Access Kenya</h1>
    <p>Disability Certification System — Ministry of Health</p>
  </div>
  <div class="body">
    {% block body %}{% endblock %}
  </div>
  <div class="footer">
    <p>This email was sent by PWD Access Kenya. Please do not reply to this email.</p>
    <p>&copy; {% now "Y" %} PWD Access Kenya &mdash; <a href="#">Visit Portal</a></p>
  </div>
</div>
</body>
</html>
